# Classification methodology (see docs/METHODOLOGY.md for the reasoning).
#
# 1. Every OSM feature is matched against `rules` (first match wins) and gets ONE class
#    `<category>/<subcategory>`, or is ignored when nothing matches.
# 2. Line features (roads, railways, waterways) are turned into polygons by buffering
#    with an estimated width (`line_widths`).
# 3. Classes are "painted" onto the administrative area in `priority` order: a class only
#    receives the area not already taken by a higher-priority class. This makes the
#    breakdown mutually exclusive, and its sum equals the administrative area.
#    Whatever is left at the end becomes `unclassified/no_data`.
#
# Changing rules / priority / widths changes the methodology hash, so `urbanfp run` reprocesses
# affected cities. Changing only labels (`label`, `label_uk`) or colours re-runs just the web export.

version: 1

# ---------------------------------------------------------------- categories
# Order here = display order (stacked bars, legend). Colors are used by the web app
# and the overview rasters. `label` = English, `label_uk` = Ukrainian (web app default language).
categories:
