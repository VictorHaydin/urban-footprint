      - {id: airport,          label: "Airport grounds", label_uk: "Територія аеропорту",                color: "#bdbdc9"}
      - {id: garages_land,     label: "Garage cooperatives (land)", label_uk: "Гаражні кооперативи (територія)",     color: "#c4b4a8"}
      - {id: bare,             label: "Sand, beaches, bare ground", label_uk: "Пісок, пляжі, відкритий ґрунт",     color: "#efe2b0"}
      - {id: structures,       label: "Piers, breakwaters, other structures", label_uk: "Причали, хвилерізи, інші споруди", color: "#a9a094"}
