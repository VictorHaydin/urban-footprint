# ---------------------------------------------------------------- priority
# Painting order, highest priority first. Entries are `category/subcategory` or
# `category/*` (all subcategories of the category, in the order listed above).
# Principle: physical, precisely-mapped surfaces (buildings, tracks, roads) first;
# then land COVER (water, sports surfaces, vegetation); then land USE polygons last,
# so that e.g. buildings inside an industrial zone count as buildings only.
priority:
  - buildings/*
  - railways/track
  - railways/metro_surface
  - railways/tram
  - railways/platform
  - roads/*
  - parking/*
  - other/structures
  - water/*
  - sports/*
  - green/*
  - cemeteries/*
  - agriculture/*
  - industrial/*
  - railways/railway_land
  - residential/*
  - other/*
  - unclassified/*

# ---------------------------------------------------------------- global exclusions
# Features matching any of these are dropped before classification
# (they are not visible on the ground surface or do not exist physically).
exclude:
  - {tunnel: [yes, culvert, flooded]}
  - {location: [underground, underwater]}
  - {parking: [underground]}
  - {layer: ["-1", "-2", "-3", "-4", "-5"], building: "*"}   # underground structures
  - {"building:part": "*"}

# ---------------------------------------------------------------- rules
# First match wins. `match` keys must all match:
#   value list  -> tag value must be one of them
#   "*"         -> tag present (and not "no")
#   `not`       -> none of these may match
#   `geom`      -> area | line (default: any). Closed ways are areas or lines per
#                  standard OSM area semantics (see osm_geometry.py).
# `footprint`: polygon (default for areas) | buffer (lines; width from line_widths.<width_group>)
# `basis` documents what the classification is based on (recorded per feature).
rules:
  # ---------- buildings (by building=* value)
  - {class: buildings/detached_house, match: {building: [house, detached, semidetached_house, bungalow, cabin, terrace, farm, villa, dacha, hut]}, geom: area}
  - {class: buildings/apartments,     match: {building: [apartments, dormitory]}, geom: area}
  - {class: buildings/residential,    match: {building: [residential]}, geom: area}
  - {class: buildings/commercial,     match: {building: [commercial, office, retail, supermarket, kiosk, hotel, shop, mall, bank]}, geom: area}
  - {class: buildings/industrial,     match: {building: [industrial, warehouse, factory, manufacture, storage, hangar, depot, works, digester, silo]}, geom: area}
  - {class: buildings/public,         match: {building: [public, civic, government, school, university, college, kindergarten, hospital, clinic, church, cathedral, chapel, mosque, synagogue, temple, religious, monastery, train_station, transportation, fire_station, police, sports_hall, sports_centre, stadium, grandstand, museum, library, theatre, military, barracks, office_government]}, geom: area}
  - {class: buildings/other,          match: {building: [garage, garages, shed, roof, greenhouse, farm_auxiliary, barn, stable, cowshed, service, construction, ruins, carport, parking, bunker, transformer_tower, container, toilets, gatehouse, boathouse, kiosk_service, utility, pavilion, tent, water_tower, tower, bridge, outbuilding, allotment_house]}, geom: area}
  # building=yes (or other unspecific value): only explicit tags on the SAME object are used,
  # no guessing from surroundings. Controlled by `building_secondary_tags` below.
  - {class: buildings/unknown,        match: {building: "*"}, geom: area, basis: building_unknown}

  # ---------- railways (lines buffered; see line_widths.railway)
  - {class: railways/metro_surface, match: {railway: [subway]}, geom: line, footprint: buffer, width_group: railway}
  - {class: railways/tram,          match: {railway: [tram]}, geom: line, footprint: buffer, width_group: railway}
  - {class: railways/track,         match: {railway: [rail, light_rail, narrow_gauge, monorail, funicular, disused, preserved, miniature]}, geom: line, footprint: buffer, width_group: railway}
  - {class: railways/platform,      match: {railway: [platform]}, geom: area}
  - {class: railways/platform,      match: {public_transport: [platform], railway: "*"}, geom: area}
  - {class: railways/platform,      match: {railway: [platform]}, geom: line, footprint: buffer, width_group: railway}
  - {class: railways/railway_land,  match: {landuse: [railway]}, geom: area}

  # ---------- roads
  - {class: roads/airfield,   match: {aeroway: [runway, taxiway, apron, helipad]}, geom: area}
  - {class: roads/airfield,   match: {aeroway: [runway, taxiway, taxilane]}, geom: line, footprint: buffer, width_group: aeroway}
  - {class: roads/road_area,  match: {"area:highway": "*"}, geom: area}
  - {class: roads/road_area,  match: {man_made: [bridge]}, geom: area}      # bridge deck outlines
  - {class: roads/pedestrian, match: {highway: [pedestrian, footway, path, cycleway, steps, bridleway, platform, corridor, track]}, geom: area}
  # other highway polygons only with explicit area=yes (OSM convention). Guards against mis-tagged
  # polygons, e.g. relation 21217234 (Dnipro reservoir) tagged highway=residential.
  - {class: roads/minor,      match: {highway: "*", area: [yes]}, geom: area, not: {highway: [construction, proposed, abandoned, razed, services, rest_area]}}
  - {class: roads/major,      match: {highway: [motorway, trunk, primary, secondary, tertiary, motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]}, geom: line, footprint: buffer, width_group: highway}
  - {class: roads/minor,      match: {highway: [residential, unclassified, living_street, road, busway, bus_guideway]}, geom: line, footprint: buffer, width_group: highway}
  - {class: roads/service,    match: {highway: [service, track]}, geom: line, footprint: buffer, width_group: highway}
  - {class: roads/pedestrian, match: {highway: [pedestrian, footway, path, cycleway, steps, bridleway, platform]}, geom: line, footprint: buffer, width_group: highway}

  # ---------- parking
  - {class: parking/surface, match: {amenity: [parking]}, geom: area, not: {parking: [multi-storey, rooftop]}}
  - {class: parking/surface, match: {amenity: [parking_space]}, geom: area}

  # ---------- structures over water
  - {class: other/structures, match: {man_made: [pier, breakwater, groyne, quay, dyke]}, geom: area}

  # ---------- water
  - {class: water/river, match: {water: [river, canal, stream, oxbow, ditch, drain, moat]}, geom: area}
  - {class: water/river, match: {waterway: [riverbank, river, canal, stream, dock]}, geom: area}
  - {class: water/lake,  match: {water: [lake, pond, reservoir, lagoon, basin, lock]}, geom: area}
  - {class: water/lake,  match: {landuse: [reservoir]}, geom: area}
  - {class: water/other, match: {natural: [water]}, geom: area}
  - {class: water/other, match: {landuse: [basin]}, geom: area}
  - {class: water/other, match: {amenity: [fountain]}, geom: area}
  - {class: water/other, match: {water: "*"}, geom: area}
  - {class: water/river, match: {waterway: [river, canal, stream, ditch, drain]}, geom: line, footprint: buffer, width_group: waterway}

  # ---------- sports & recreation
  - {class: sports/playground, match: {leisure: [playground]}, geom: area}
  - {class: sports/sports,     match: {leisure: [pitch, stadium, sports_centre, track, golf_course, ice_rink, swimming_pool, water_park, fitness_station, horse_riding, miniature_golf, sports_hall, racetrack, shooting_ground, skatepark]}, geom: area}
  - {class: sports/sports,     match: {landuse: [winter_sports]}, geom: area}
  - {class: sports/other,      match: {leisure: [amusement_arcade, beach_resort, summer_camp, marina, dog_park, resort, bandstand]}, geom: area}
  - {class: sports/other,      match: {tourism: [theme_park, zoo, camp_site]}, geom: area}

  # ---------- green space (land cover first, then park-type land use)
  - {class: green/forest,     match: {landuse: [forest]}, geom: area}
  - {class: green/forest,     match: {natural: [wood]}, geom: area}
  - {class: green/wetland,    match: {natural: [wetland]}, geom: area}
  - {class: green/grass,      match: {natural: [grassland, scrub, heath, fell, tundra]}, geom: area}
  - {class: green/grass,      match: {landuse: [grass, meadow, village_green, flowerbed, recreation_ground]}, geom: area}
  - {class: green/park,       match: {leisure: [park, garden, common, nature_reserve_park]}, geom: area}
  - {class: green/allotments, match: {landuse: [allotments]}, geom: area}

  # ---------- cemeteries
  - {class: cemeteries/cemetery, match: {landuse: [cemetery]}, geom: area}
  - {class: cemeteries/cemetery, match: {amenity: [grave_yard]}, geom: area}

  # ---------- agriculture
  - {class: agriculture/farmland, match: {landuse: [farmland]}, geom: area}
  - {class: agriculture/orchard,  match: {landuse: [orchard, vineyard]}, geom: area}
  - {class: agriculture/other,    match: {landuse: [farmyard, greenhouse_horticulture, plant_nursery, animal_keeping, aquaculture]}, geom: area}

  # ---------- industrial land
  - {class: industrial/port,            match: {landuse: [port]}, geom: area}
  - {class: industrial/quarry_landfill, match: {landuse: [quarry, landfill]}, geom: area}
  - {class: industrial/utilities,       match: {power: [plant, substation, generator]}, geom: area}
  - {class: industrial/utilities,       match: {man_made: [wastewater_plant, water_works, works, reservoir_covered, storage_tank, gasometer, silo]}, geom: area}
  - {class: industrial/industrial,      match: {landuse: [industrial, depot]}, geom: area}

  # ---------- other mapped land
  - {class: other/airport,          match: {aeroway: [aerodrome]}, geom: area}
  - {class: other/military,         match: {landuse: [military]}, geom: area}
  - {class: other/military,         match: {military: "*"}, geom: area}
  - {class: other/construction,     match: {landuse: [construction, brownfield, greenfield]}, geom: area}
  - {class: other/garages_land,     match: {landuse: [garages]}, geom: area}
  - {class: other/bare,             match: {natural: [sand, beach, bare_rock, scree, shingle, mud]}, geom: area}
  - {class: other/institutional,    match: {amenity: [school, university, college, kindergarten, hospital, clinic, prison, place_of_worship, fire_station, police, townhall, social_facility, research_institute, community_centre]}, geom: area}
  - {class: other/commercial_land,  match: {amenity: [fuel, marketplace, car_wash]}, geom: area}
  - {class: other/institutional,    match: {landuse: [education, institutional, religious]}, geom: area}
  - {class: other/commercial_land,  match: {landuse: [commercial, retail]}, geom: area}
  - {class: residential/yards,      match: {landuse: [residential]}, geom: area}
  - {class: other/other_landuse,    match: {landuse: "*"}, geom: area, not: {landuse: [proposed, planned, no]}}

# For buildings with an unspecific `building` value (yes / unrecognized), use these
# tags ON THE SAME OSM OBJECT to determine the subcategory. Set `enabled: false`
# to classify strictly by `building=*` only. Buildings classified this way are
# counted separately in the validation report (basis = secondary_tag).
building_secondary_tags:
  enabled: true
  rules:
    - {class: buildings/apartments, match: {"building:use": [apartments, residential]}}
    - {class: buildings/commercial, match: {"building:use": [commercial, retail, office]}}
    - {class: buildings/industrial, match: {"building:use": [industrial, warehouse]}}
    - {class: buildings/public,     match: {amenity: [school, university, college, kindergarten, hospital, clinic, place_of_worship, townhall, library, theatre, fire_station, police, community_centre, courthouse]}}
    - {class: buildings/commercial, match: {shop: "*"}}
    - {class: buildings/commercial, match: {office: "*"}}
    - {class: buildings/commercial, match: {tourism: [hotel, hostel, motel]}}
    - {class: buildings/industrial, match: {industrial: "*"}}
    - {class: buildings/industrial, match: {man_made: [works]}}

# ---------------------------------------------------------------- line widths
# Total physical width in metres used to buffer line features (buffer radius = width/2).
# Resolution order for each line: explicit `width` tag -> `est_width` tag ->
# lanes * lane_width (highways) -> default by type. Each feature records `width_source`
# (tag | lanes | default) so estimated areas can be quantified.
line_widths:
  highway:
    # [two-way default, oneway default] carriageway width in metres
    defaults:
      motorway: [15.0, 8.0]
      trunk: [14.0, 7.5]
      primary: [12.0, 7.0]
      secondary: [10.0, 6.5]
      tertiary: [8.0, 5.5]
      motorway_link: [7.0, 5.0]
      trunk_link: [7.0, 5.0]
      primary_link: [7.0, 5.0]
      secondary_link: [6.5, 5.0]
      tertiary_link: [6.0, 4.5]
      unclassified: [6.0, 4.0]
      residential: [6.0, 4.0]
      living_street: [5.0, 4.0]
      road: [6.0, 4.0]
      busway: [7.0, 4.0]
      bus_guideway: [7.0, 4.0]
      service: [4.5, 3.5]
      track: [3.0, 3.0]
      pedestrian: [5.0, 5.0]
      footway: [2.0, 2.0]
      path: [1.5, 1.5]
      cycleway: [2.0, 2.0]
      steps: [2.0, 2.0]
      bridleway: [2.0, 2.0]
      platform: [3.0, 3.0]
    service_overrides:      # by service=* value
      parking_aisle: 5.5
      driveway: 3.0
      alley: 3.5
      drive-through: 3.5
    lane_width:             # metres per lane when `lanes` is tagged
      motorway: 3.75
      trunk: 3.75
      primary: 3.5
      secondary: 3.25
      tertiary: 3.25
      default: 3.0
    # Sidewalks are only added when explicitly tagged on the road (sidewalk=both|left|right).
    # Sidewalks mapped as separate footways are handled by the footway rule.
    sidewalk_width: 2.0
    max_width: 60.0         # cap for absurd width tags
