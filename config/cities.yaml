# City definitions.
#
# To add a city: append an entry with a unique `id` (used in file paths and URLs)
# and the OSM relation id of its administrative boundary
# (find it on https://www.openstreetmap.org or via Nominatim), then run
#   python -m urbanfp run <id>
#
# Fields:
#   id                  short slug, [a-z0-9_-]
#   name / name_local   display names
#   country             ISO 3166-1 alpha-2
#   boundary_relation   OSM relation id of the administrative boundary
#   clip_to_land        (optional, default false) remove open sea from the territory using the OSM
#                       coastline (bays mapped as natural=bay stay, as water). For boundaries that extend
#                       into the sea
#   source              OSM source extract, "geofabrik:<region path>" as on download.geofabrik.de
#                       (default from `defaults`). Cities sharing a source are extracted in one pass.
#   notes / notes_uk    free text (English / Ukrainian), shown in reports and on the Method & data page
#   territories         (optional, default false) also compute the Hromada and Greater City territory
#                       modes (see docs/SUBURBS.md). Extraction then covers the wider region.
#   hromada_relation    OSM relation of the city's hromada (admin_level=7), for Hromada mode.
#                       Omit when the city has no hromada level (Kyiv).
#   katottg             (optional) KATOTTG code of the city for population data (data/demography); found
#                       by name when empty. Needed where the name is ambiguous (Mykolaiv) or for Kyiv
#   occupied_since      (optional) year of temporary occupation. Cities occupied before the 2020 hromada
#                       reform use the city boundary in Hromada mode (their hromada exists on paper only)
#   suburbs_radius_km   (optional, default 25) search radius for Greater City settlements
#   group               id of a city group below (default: the last group). The web app lists cities
#                       by group (in the order of `groups`), alphabetically by Ukrainian name within a group.
#   tiles               (default from `defaults`) published URL of the folder holding the city's map tiles
#                       (<id>/features.pmtiles, <id>/overview.bin), a separate GitHub Pages site so the
#                       app's own deploys stay small. Copy them there with `python -m urbanfp publish-tiles`.
#                       Locally (localhost) the app reads the tiles from web/data instead.

groups:
  - {id: million, label: "Largest cities", label_uk: "Міста-мільйонники"}
  - {id: regional, label: "Oblast centres", label_uk: "Обласні центри"}
  - {id: other,   label: "Other cities",   label_uk: "Інші міста"}

defaults:
  source: "geofabrik:europe/ukraine"
  tiles: "https://victorhaydin.github.io/urban-footprint-data/"

cities:
