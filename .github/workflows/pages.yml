# Publishes the static web app (web/, including the committed datasets in web/data) to GitHub Pages.
# Data is NOT processed in CI: run the pipeline locally, commit web/data, push. Map tiles (features.pmtiles,
# overview.bin) are not in this repository: they are published from VictorHaydin/urban-footprint-data
# (`python -m urbanfp publish-tiles ../urban-footprint-data`, then commit and push there).
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
